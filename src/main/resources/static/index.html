<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Management</title>
<style>
  :root { --ink:#1e293b; --muted:#64748b; --line:#dfe4ea; --bg:#f5f7f6; --card:#fff; --accent:#0f766e; --danger:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  header { padding:28px 20px 8px; max-width:960px; margin:0 auto; }
  h1 { margin:0; font-size:1.7rem; letter-spacing:-0.02em; }
  header p { margin:4px 0 0; color:var(--muted); }
  main { max-width:960px; margin:0 auto; padding:16px 20px 48px; display:grid; gap:20px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; }
  h2 { margin:0 0 14px; font-size:1.1rem; }
  form { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; align-items:end; }
  label { display:grid; gap:4px; font-size:.85rem; color:var(--muted); }
  input, select { padding:9px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; color:var(--ink); background:#fff; }
  input:focus, select:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { padding:9px 14px; border:0; border-radius:6px; font:inherit; cursor:pointer; background:var(--accent); color:#fff; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button.danger { background:transparent; color:var(--danger); border:1px solid var(--danger); }
  .toolbar { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .toolbar input { flex:1; min-width:200px; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:.85rem; }
  td.actions { display:flex; gap:6px; }
  .msg { margin:0 0 12px; padding:9px 12px; border-radius:6px; font-size:.9rem; display:none; }
  .msg.error { display:block; background:#fef2f2; color:var(--danger); }
  .msg.ok { display:block; background:#ecfdf5; color:var(--accent); }
  .empty { color:var(--muted); padding:18px 0; }
</style>
</head>
<body>
<header>
  <h1>Employee Management</h1>
  <p>Add, search, edit and remove employees. Data is stored through the Spring Boot REST API.</p>
</header>

<main>
  <section>
    <h2 id="form-title">Add employee</h2>
    <p id="msg" class="msg"></p>
    <form id="emp-form">
      <label>Name <input id="name" required></label>
      <label>Email <input id="email" type="email" required></label>
      <label>Salary (₹) <input id="salary" type="number" min="1" step="any" required></label>
      <label>Department <select id="department"></select></label>
      <div>
        <button type="submit" id="save-btn">Save employee</button>
        <button type="button" class="ghost" id="cancel-btn" hidden>Cancel edit</button>
      </div>
    </form>
  </section>

  <section>
    <h2>Employees</h2>
    <div class="toolbar">
      <input id="search" placeholder="Search by name">
      <button class="ghost" id="new-dept-btn" type="button">Add department</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Salary</th><th>Department</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="empty" hidden>No employees found. Add one using the form above.</p>
  </section>
</main>

<script>
const API = "/api";
let editingId = null;

const $ = id => document.getElementById(id);

function show(text, type) {
  const el = $("msg");
  el.textContent = text;
  el.className = "msg " + type;
}

async function request(url, options) {
  const res = await fetch(url, options);
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const text = data.error || Object.values(data).join(", ") || "Something went wrong";
    throw new Error(text);
  }
  return data;
}

async function loadDepartments() {
  const list = await request(API + "/departments");
  $("department").innerHTML = '<option value="">No department</option>' +
    list.map(d => `<option value="${d.id}">${d.name}</option>`).join("");
}

async function loadEmployees() {
  const q = encodeURIComponent($("search").value.trim());
  const list = await request(API + "/employees" + (q ? "?search=" + q : ""));
  $("rows").innerHTML = list.map(e => `
    <tr>
      <td>${esc(e.name)}</td>
      <td>${esc(e.email)}</td>
      <td>₹${Number(e.salary).toLocaleString("en-IN")}</td>
      <td>${e.department ? esc(e.department.name) : "-"}</td>
      <td class="actions">
        <button class="ghost" onclick="startEdit(${e.id})">Edit</button>
        <button class="danger" onclick="removeEmployee(${e.id})">Delete</button>
      </td>
    </tr>`).join("");
  $("empty").hidden = list.length > 0;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

$("emp-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const deptId = $("department").value;
  const body = {
    name: $("name").value.trim(),
    email: $("email").value.trim(),
    salary: parseFloat($("salary").value),
    department: deptId ? { id: Number(deptId) } : null
  };
  try {
    await request(API + "/employees" + (editingId ? "/" + editingId : ""), {
      method: editingId ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    show(editingId ? "Employee updated" : "Employee added", "ok");
    resetForm();
    loadEmployees();
  } catch (err) { show(err.message, "error"); }
});

async function startEdit(id) {
  const e = await request(API + "/employees/" + id);
  editingId = id;
  $("name").value = e.name;
  $("email").value = e.email;
  $("salary").value = e.salary;
  $("department").value = e.department ? e.department.id : "";
  $("form-title").textContent = "Edit employee";
  $("save-btn").textContent = "Update employee";
  $("cancel-btn").hidden = false;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetForm() {
  editingId = null;
  $("emp-form").reset();
  $("form-title").textContent = "Add employee";
  $("save-btn").textContent = "Save employee";
  $("cancel-btn").hidden = true;
}
$("cancel-btn").addEventListener("click", () => { resetForm(); $("msg").className = "msg"; });

async function removeEmployee(id) {
  if (!confirm("Delete this employee?")) return;
  try {
    await request(API + "/employees/" + id, { method: "DELETE" });
    show("Employee deleted", "ok");
    loadEmployees();
  } catch (err) { show(err.message, "error"); }
}

$("new-dept-btn").addEventListener("click", async () => {
  const name = prompt("Department name");
  if (!name || !name.trim()) return;
  try {
    await request(API + "/departments", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name.trim() })
    });
    show("Department added", "ok");
    loadDepartments();
  } catch (err) { show(err.message, "error"); }
});

let timer;
$("search").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(loadEmployees, 250); });

loadDepartments().then(loadEmployees).catch(err => show(err.message, "error"));
</script>
</body>
</html>
